<head>

<meta name="apple-mobile-web-app-capable" content="yes"><title>Smart Band F1 Plus | RoXThal Art Design</title><style>

}

    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #080808;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

    min-height: 100vh;
}

.app {
    width: 100%;
    max-width: 700px;
    margin: auto;
    padding: 20px 15px 40px;
}

    text-align: center;
    padding: 25px 10px;
}

.watch {
    font-size: 55px;
    margin-bottom: 10px;
}

    margin: 0;
    font-size: 28px;
}

.subtitle {

    color: #aaa;
}

.card {
    background: #151515;

    padding: 20px;
    margin-top: 15px;
    box-shadow: 0 8px 25px rgba(0,0,0,.35);
}

.compatibility {
    padding: 14px;
    border-radius: 12px;
    background: #222;
    text-align: center;
    margin-bottom: 15px;
    font-weight: bold;
}

    width: 100%;
    border: 0;
    border-radius: 13px;
    padding: 16px;
    margin-top: 10px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

#connect {
    background: #e0b400;
    color: #111;
}

#disconnect {
    background: #333;
    color: white;
    display: none;
}

#test {
    background: #252525;
    color: #fff;
}

button:disabled {
    opacity: .55;
}

.status {
    margin-top: 15px;
    padding: 15px;
    border-radius: 12px;
    text-align: center;
    background: #202020;
}

.success {
    background: #123d20;
    color: #7cff9b;
}

.error {
    background: #431515;
    color: #ff9999;
}

.warning {
    background: #403715;
    color: #ffe477;
}

.info {
    display: none;
}

.row {
    background: #202020;

    border-radius: 9px;

}

}

.log {
    background: #050505;
    border-radius: 12px;
    padding: 14px;
    min-height: 180px;
    max-height: 350px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: monospace;
    font-size: 12px;
    line-height: 1.5;
    color: #ccc;
}

.clear {
    background: #292929;
    color: white;
    font-size: 14px;
}

.service {
    margin-top: 10px;
    padding: 12px;
    background: #202020;
    border-radius: 10px;

}

.footer {
    text-align: center;
    color: #666;
    font-size: 12px;
    margin-top: 25px;
}
</style></head><body><div class="app"><header>
    <div class="watch">⌚</div>
    <h1>Smart Band F1 Plus</h1>
    <div class="subtitle">RoXThal Art Design</div>
</header><section class="card"><div id="compatibility" class="compatibility">
    🔵 Comprobando Bluetooth...
</div>

<button id="connect" type="button">
    🔗 CONECTAR SMART BAND
</button>

<button id="disconnect" type="button">
    ❌ DESCONECTAR
</button>

<button id="test" type="button">
    🧪 COMPROBAR BLUETOOTH
</button>

<div id="status" class="status">
    ⚪ Smart Band desconectada
</div>

</section><section id="deviceCard" class="card info"><h2>📱 Dispositivo detectado</h2>

<div id="name" class="row">
    Nombre: —
</div>

<div id="id" class="row">
    ID: —
</div>

<div id="gatt" class="row">
    GATT: —
</div>

</section><section id="servicesCard" class="card info"><h2>🔧 Servicios Bluetooth</h2>

<div id="services">
    Esperando conexión...
</div>

</section><section class="card"><h2>🛠️ Diagnóstico F1 Plus</h2>

<div id="log" class="log">Sistema preparado.</div>

<button id="clear" class="clear" type="button">
    🧹 LIMPIAR DIAGNÓSTICO
</button>

</section><div class="footer">
    RoXThal Art Design · Smart Band F1 Plus
</div></div><script>
"use strict";

/*
============================================================
SMART BAND F1 PLUS
VERSIÓN LIMPIA
============================================================

IMPORTANTE:

No se utilizan UUID específicos para iniciar la conexión.

Primero:
1. Detectamos Web Bluetooth.
2. Abrimos el selector.
3. Seleccionamos F1/F1 Plus.
4. Conectamos GATT.
5. Después descubrimos los servicios reales.

============================================================
*/

let device = null;
let server = null;

const $ = id => document.getElementById(id);

const compatibility = $("compatibility");
const connectButton = $("connect");
const disconnectButton = $("disconnect");
const testButton = $("test");
const status = $("status");

const deviceCard = $("deviceCard");
const nameElement = $("name");
const idElement = $("id");
const gattElement = $("gatt");

const servicesCard = $("servicesCard");
const servicesElement = $("services");

const logElement = $("log");
const clearButton = $("clear");


/* =========================================================
   DIAGNÓSTICO
========================================================= */

function log(message) {

    const time = new Date().toLocaleTimeString();

    const line = "[" + time + "] " + message;

    console.log(line);

    if (logElement) {

        if (
            logElement.textContent.trim() ===
            "Sistema preparado."
        ) {
            logElement.textContent = "";
        }

        logElement.textContent += line + "\n";

        logElement.scrollTop =
            logElement.scrollHeight;
    }
}


/* =========================================================
   ESTADO
========================================================= */

function setStatus(message, type) {

    status.textContent = message;

    status.className = "status";

    if (type) {
        status.classList.add(type);
    }
}


/* =========================================================
   COMPROBAR BLUETOOTH
========================================================= */

function checkBluetooth() {

    log("Comprobando Web Bluetooth...");

    if (
        typeof navigator === "undefined" ||
        !navigator.bluetooth
    ) {

        compatibility.textContent =
            "❌ Web Bluetooth no está disponible.";

        compatibility.classList.add("error");

        connectButton.disabled = true;

        log("ERROR: navigator.bluetooth no está disponible.");

        log(
            "Necesitas un navegador compatible con Web Bluetooth."
        );

        return false;
    }

    compatibility.textContent =
        "✅ Web Bluetooth disponible";

    compatibility.classList.remove("error");

    log("Web Bluetooth detectado correctamente.");

    connectButton.disabled = false;

    return true;
}


/* =========================================================
   CONECTAR
========================================================= */

async function connectBand() {

    log("--------------------------------");
    log("INICIO DE CONEXIÓN");

    if (!checkBluetooth()) {

        setStatus(
            "❌ Bluetooth Web no disponible",
            "error"
        );

        return;
    }

    connectButton.disabled = true;
    connectButton.textContent =
        "🔍 BUSCANDO DISPOSITIVO...";

    setStatus(
        "🔵 Abriendo selector Bluetooth...",
        "warning"
    );

    try {

        log("Solicitando dispositivo Bluetooth.");

        /*
         * IMPORTANTE:
         *
         * acceptAllDevices permite que el selector
         * encuentre la F1 aunque todavía no conozcamos
         * sus UUID específicos.
         */

        device =
            await navigator.bluetooth.requestDevice({
                acceptAllDevices: true
            });

        if (!device) {
            throw new Error(
                "No se recibió ningún dispositivo."
            );
        }

        log("DISPOSITIVO ENCONTRADO");

        log(
            "Nombre: " +
            (device.name || "Sin nombre")
        );

        log(
            "ID: " +
            (device.id || "No disponible")
        );

        nameElement.textContent =
            "Nombre: " +
            (device.name || "Sin nombre");

        idElement.textContent =
            "ID: " +
            (device.id || "No disponible");

        gattElement.textContent =
            "GATT: preparando conexión...";

        deviceCard.style.display = "block";

        device.addEventListener(
            "gattserverdisconnected",
            handleDisconnected
        );

        connectButton.textContent =
            "🔄 CONECTANDO...";

        setStatus(
            "🔄 Conectando con " +
            (device.name || "F1 Plus") +
            "...",
            "warning"
        );

        if (!device.gatt) {
            throw new Error(
                "El dispositivo no dispone de GATT."
            );
        }

        log("Conectando al servidor GATT...");

        server = await device.gatt.connect();

        if (!server.connected) {
            throw new Error(
                "El servidor GATT no quedó conectado."
            );
        }

        log("✅ CONEXIÓN GATT ESTABLECIDA");

        gattElement.textContent =
            "GATT: 🟢 CONECTADO";

        setStatus(
            "🟢 Smart Band conectada",
            "success"
        );

        connectButton.textContent =
            "🟢 F1 PLUS CONECTADA";

        disconnectButton.style.display =
            "block";

        /*
         * Ahora sí intentamos descubrir servicios.
         * Si falla, la conexión sigue siendo válida.
         */

        await discoverServices();

    } catch (error) {

        console.error(error);

        log("ERROR DURANTE LA CONEXIÓN");
        log(
            "Tipo: " +
            (error.name || "desconocido")
        );
        log(
            "Mensaje: " +
            (error.message || String(error))
        );

        if (
            error.name === "NotFoundError"
        ) {

            setStatus(
                "⚪ Selección cancelada",
                "warning"
            );

            log(
                "El selector Bluetooth fue cancelado."
            );

        } else {

            setStatus(
                "❌ No se pudo conectar",
                "error"
            );
        }

        connectButton.disabled = false;

        connectButton.textContent =
            "🔗 CONECTAR SMART BAND";
    }
}


/* =========================================================
   DESCUBRIR SERVICIOS
========================================================= */

async function discoverServices() {

    if (
        !server ||
        !server.connected
    ) {

        log(
            "No hay conexión GATT para buscar servicios."
        );

        return;
    }

    log("--------------------------------");
    log("DESCUBRIENDO SERVICIOS GATT...");

    servicesCard.style.display = "block";

    servicesElement.innerHTML = "";

    let services;

    try {

        services =
            await server.getPrimaryServices();

    } catch (error) {

        log(
            "⚠️ No se pudieron obtener los servicios."
        );

        log(
            "Motivo: " +
            (error.message || error)
        );

        servicesElement.innerHTML =
            "<div class='service'>" +
            "⚠️ La conexión existe, pero el dispositivo " +
            "no permite consultar sus servicios mediante " +
            "Web Bluetooth." +
            "</div>";

        return;
    }

    log(
        "Servicios encontrados: " +
        services.length
    );

    if (services.length === 0) {

        servicesElement.innerHTML =
            "<div class='service'>" +
            "⚠️ No se encontraron servicios." +
            "</div>";

        return;
    }

    for (
        const service of services
    ) {

        log(
            "Servicio: " +
            service.uuid
        );

        const serviceDiv =
            document.createElement("div");

        serviceDiv.className = "service";

        serviceDiv.innerHTML =
            "<strong>🔧 Servicio</strong><br>" +
            service.uuid;

        try {

            const characteristics =
                await service.getCharacteristics();

            log(
                "Características: " +
                characteristics.length
            );

            for (
                const characteristic
                of characteristics
            ) {

                const charDiv =
                    document.createElement("div");

                charDiv.style.marginTop =
                    "10px";

                charDiv.style.padding =
                    "10px";

                charDiv.style.background =
                    "#101010";

                charDiv.style.borderRadius =
                    "8px";

                let properties =
                    Object.keys(
                        characteristic.properties || {}
                    ).filter(
                        key =>
                            characteristic.properties[key]
                    );

                charDiv.innerHTML =
                    "<strong>Característica:</strong><br>" +
                    characteristic.uuid +
                    "<br><br>" +
                    "<strong>Propiedades:</strong><br>" +
                    properties.join(", ");

                serviceDiv.appendChild(
                    charDiv
                );

                log(
                    "Característica: " +
                    characteristic.uuid +
                    " | " +
                    properties.join(", ")
                );
            }

        } catch (error) {

            log(
                "⚠️ Error leyendo características: " +
                error.message
            );
        }

        servicesElement.appendChild(
            serviceDiv
        );
    }

    log("--------------------------------");
    log("FIN DEL DESCUBRIMIENTO GATT");
    log(
        "Los UUID encontrados servirán para estudiar el protocolo de la F1 Plus."
    );
}


/* =========================================================
   DESCONEXIÓN
========================================================= */

function disconnectBand() {

    log("Solicitando desconexión...");

    try {

        if (
            device &&
            device.gatt &&
            device.gatt.connected
        ) {

            device.gatt.disconnect();

            log(
                "Desconexión GATT ejecutada."
            );
        }

    } catch (error) {

        log(
            "Error al desconectar: " +
            error.message
        );
    }

    server = null;

    handleDisconnected();
}


/* =========================================================
   EVENTO DE DESCONEXIÓN
========================================================= */

function handleDisconnected() {

    log("--------------------------------");
    log("🔴 DISPOSITIVO DESCONECTADO");

    setStatus(
        "🔴 Smart Band desconectada",
        "error"
    );

    gattElement.textContent =
        "GATT: 🔴 DESCONECTADO";

    connectButton.disabled = false;

    connectButton.textContent =
        "🔗 CONECTAR SMART BAND";

    disconnectButton.style.display =
        "none";

    server = null;
}


/* =========================================================
   LIMPIAR
========================================================= */

function clearLog() {

    logElement.textContent =
        "Sistema preparado.";

    log("Diagnóstico limpiado.");
}


/* =========================================================
   EVENTOS
========================================================= */

connectButton.addEventListener(
    "click",
    connectBand
);

disconnectButton.addEventListener(
    "click",
    disconnectBand
);

testButton.addEventListener(
    "click",
    checkBluetooth
);

clearButton.addEventListener(
    "click",
    clearLog
);


/* =========================================================
   ARRANQUE
========================================================= */

window.addEventListener(
    "load",
    function () {

        log(
            "================================"
        );

        log(
            "SMART BAND F1 PLUS INICIADA"
        );

        log(
            "Página cargada correctamente."
        );

        checkBluetooth();

    }
);

})();
</script></body>
</html>
