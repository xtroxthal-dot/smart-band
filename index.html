<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta name="theme-color" content="#111111">

<title>RoXThal Art Design - Smart Band F1 Plus</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: #080808;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
}

.container {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 20px 15px 40px;
}

.header {
    text-align: center;
    padding: 20px 10px;
}

.logo {
    font-size: 48px;
    margin-bottom: 8px;
}

.title {
    font-size: 28px;
    font-weight: bold;
    margin: 0;
}

.subtitle {
    color: #aaa;
    margin-top: 8px;
}

.card {
    background: #151515;
    border-radius: 20px;
    padding: 20px;
    margin-top: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,.35);
}

.compatibility {
    background: #222;
    border-radius: 12px;
    padding: 14px;
    text-align: center;
    color: #ffd54a;
    margin-bottom: 15px;
}

button {
    width: 100%;
    border: 0;
    border-radius: 14px;
    padding: 16px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

#connectBandBtn {
    background: #e0b400;
    color: #111;
}

#disconnectBandBtn {
    background: #333;
    color: #fff;
    display: none;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.status {
    margin-top: 15px;
    padding: 15px;
    border-radius: 12px;
    background: #202020;
    text-align: center;
}

.status.success {
    background: #123d20;
    color: #7cff9b;
}

.status.error {
    background: #431515;
    color: #ff8f8f;
}

.status.warning {
    background: #403715;
    color: #ffe477;
}

.info {
    display: none;
}

.info-row {
    padding: 10px;
    margin-top: 7px;
    background: #202020;
    border-radius: 9px;
    word-break: break-word;
}

.section-title {
    color: #ffd54a;
    font-size: 19px;
    margin-top: 0;
}

.service {
    background: #202020;
    border-radius: 14px;
    padding: 14px;
    margin-top: 12px;
}

.service-title {
    color: #ffd54a;
    font-weight: bold;
    word-break: break-all;
}

.characteristic {
    background: #101010;
    border-radius: 10px;
    padding: 11px;
    margin-top: 10px;
    word-break: break-all;
    font-size: 13px;
}

.property {
    display: inline-block;
    padding: 4px 7px;
    margin: 4px 3px 0 0;
    border-radius: 6px;
    background: #333;
    color: #ddd;
}

.read-data {
    margin-top: 7px;
    color: #8fe3ff;
}

.log {
    background: #050505;
    border-radius: 12px;
    padding: 14px;
    max-height: 350px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: monospace;
    font-size: 12px;
    line-height: 1.55;
    color: #ccc;
}

.clear-button {
    background: #292929;
    color: #fff;
    font-size: 14px;
    padding: 11px;
}

.footer {
    text-align: center;
    color: #777;
    font-size: 12px;
    margin-top: 25px;
}

</style>
</head>


<body>

<div class="container">

    <header class="header">

        <div class="logo">
            ⌚
        </div>

        <h1 class="title">
            Smart Band F1 Plus
        </h1>

        <div class="subtitle">
            RoXThal Art Design
        </div>

    </header>


    <!-- =====================================================
         CONEXIÓN
         ===================================================== -->

    <section class="card">

        <div
            id="bluetoothCompatibility"
            class="compatibility"
        >
            🔵 Comprobando compatibilidad Bluetooth...
        </div>


        <button
            id="connectBandBtn"
            type="button"
        >
            🔗 Conectar Smart Band
        </button>


        <button
            id="disconnectBandBtn"
            type="button"
        >
            ❌ Desconectar Smart Band
        </button>


        <div
            id="bandStatus"
            class="status"
        >
            ⚪ Estado: Desconectada
        </div>

    </section>


    <!-- =====================================================
         INFORMACIÓN DEL DISPOSITIVO
         ===================================================== -->

    <section
        id="bandDeviceInfo"
        class="card info"
    >

        <h2 class="section-title">
            📱 Dispositivo detectado
        </h2>

        <div
            id="deviceName"
            class="info-row"
        >
            Nombre: —
        </div>

        <div
            id="deviceId"
            class="info-row"
        >
            ID: —
        </div>

        <div
            id="deviceGATT"
            class="info-row"
        >
            GATT: —
        </div>

    </section>


    <!-- =====================================================
         SERVICIOS BLUETOOTH
         ===================================================== -->

    <section
        id="bandServicesBox"
        class="card info"
    >

        <h2 class="section-title">
            🔧 Servicios Bluetooth
        </h2>

        <div
            id="bandServices"
        >
            Esperando información...
        </div>

    </section>


    <!-- =====================================================
         DIAGNÓSTICO
         ===================================================== -->

    <section class="card">

        <h2 class="section-title">
            🛠️ Diagnóstico F1 Plus
        </h2>

        <div
            id="bandLog"
            class="log"
        >
Sistema preparado.
        </div>

        <button
            id="clearLogBtn"
            class="clear-button"
            type="button"
        >
            🧹 Limpiar diagnóstico
        </button>

    </section>


    <div class="footer">
        RoXThal Art Design · Smart Band
    </div>

</div>


<script>

(function () {

"use strict";


/* =========================================================
   VARIABLES
   ========================================================= */

let bluetoothDevice = null;

let bluetoothServer = null;


/* =========================================================
   ELEMENTOS
   ========================================================= */

const connectBtn =
    document.getElementById(
        "connectBandBtn"
    );

const disconnectBtn =
    document.getElementById(
        "disconnectBandBtn"
    );

const compatibility =
    document.getElementById(
        "bluetoothCompatibility"
    );

const status =
    document.getElementById(
        "bandStatus"
    );

const deviceInfo =
    document.getElementById(
        "bandDeviceInfo"
    );

const deviceName =
    document.getElementById(
        "deviceName"
    );

const deviceId =
    document.getElementById(
        "deviceId"
    );

const deviceGATT =
    document.getElementById(
        "deviceGATT"
    );

const servicesBox =
    document.getElementById(
        "bandServicesBox"
    );

const servicesContainer =
    document.getElementById(
        "bandServices"
    );

const logContainer =
    document.getElementById(
        "bandLog"
    );

const clearLogBtn =
    document.getElementById(
        "clearLogBtn"
    );


/* =========================================================
   DIAGNÓSTICO
   ========================================================= */

function log(message) {

    const now =
        new Date().toLocaleTimeString();

    const line =
        "[" + now + "] " + message;

    console.log(line);

    if (logContainer) {

        if (
            logContainer.textContent.trim()
            === "Sistema preparado."
        ) {
            logContainer.textContent = "";
        }

        logContainer.textContent +=
            line + "\n";

        logContainer.scrollTop =
            logContainer.scrollHeight;
    }
}


/* =========================================================
   CAMBIAR ESTADO
   ========================================================= */

function setStatus(
    message,
    type
) {

    status.textContent =
        message;

    status.className =
        "status";

    if (type === "success") {

        status.classList.add(
            "success"
        );

    } else if (type === "error") {

        status.classList.add(
            "error"
        );

    } else if (type === "warning") {

        status.classList.add(
            "warning"
        );
    }
}


/* =========================================================
   COMPATIBILIDAD BLUETOOTH
   ========================================================= */

function checkBluetooth() {

    log(
        "Comprobando Web Bluetooth..."
    );


    if (
        !navigator.bluetooth
    ) {

        compatibility.textContent =
            "❌ Web Bluetooth no está disponible en este navegador.";

        compatibility.style.color =
            "#ff8f8f";

        connectBtn.disabled =
            true;

        log(
            "ERROR: navigator.bluetooth no existe."
        );

        return false;
    }


    compatibility.textContent =
        "✅ Web Bluetooth disponible.";

    compatibility.style.color =
        "#7cff9b";

    connectBtn.disabled =
        false;

    log(
        "Web Bluetooth detectado correctamente."
    );

    return true;
}


/* =========================================================
   CONEXIÓN
   ========================================================= */

async function connectBand() {

    log(
        "================================"
    );

    log(
        "Inicio del proceso de conexión."
    );


    if (
        !checkBluetooth()
    ) {

        setStatus(
            "❌ Bluetooth Web no disponible",
            "error"
        );

        return;
    }


    try {

        connectBtn.disabled =
            true;

        connectBtn.textContent =
            "🔍 Buscando Smart Band...";


        setStatus(
            "🔍 Abriendo selector Bluetooth...",
            "warning"
        );


        log(
            "Solicitando dispositivo Bluetooth."
        );


        /*
         * ===================================================
         * IMPORTANTE
         *
         * No usamos:
         *
         *     heart_rate_service
         *
         * porque Chrome no lo acepta como alias.
         *
         * Todos los servicios aquí son UUID válidos.
         * ===================================================
         */


        bluetoothDevice =
            await navigator.bluetooth.requestDevice({

                acceptAllDevices: true,

                optionalServices: [

                    "battery_service",

                    "device_information",

                    "heart_rate",

                    "0000180f-0000-1000-8000-00805f9b34fb",

                    "0000180a-0000-1000-8000-00805f9b34fb",

                    "0000180d-0000-1000-8000-00805f9b34fb"

                ]

            });


        if (
            !bluetoothDevice
        ) {

            throw new Error(
                "No se seleccionó ningún dispositivo."
            );
        }


        log(
            "================================"
        );

        log(
            "DISPOSITIVO ENCONTRADO"
        );


        log(
            "Nombre: " +
            (
                bluetoothDevice.name
                || "Sin nombre"
            )
        );


        log(
            "ID: " +
            (
                bluetoothDevice.id
                || "No disponible"
            )
        );


        deviceName.textContent =
            "Nombre: " +
            (
                bluetoothDevice.name
                || "Sin nombre"
            );


        deviceId.textContent =
            "ID: " +
            (
                bluetoothDevice.id
                || "No disponible"
            );


        deviceGATT.textContent =
            "GATT: pendiente de conexión";


        deviceInfo.style.display =
            "block";


        /*
         * Evento de desconexión
         */

        bluetoothDevice.addEventListener(
            "gattserverdisconnected",
            handleDisconnected
        );


        setStatus(
            "🔄 Conectando con " +
            (
                bluetoothDevice.name
                || "Smart Band"
            ) +
            "...",
            "warning"
        );


        connectBtn.textContent =
            "🔄 Conectando...";


        log(
            "Intentando conexión GATT..."
        );


        if (
            !bluetoothDevice.gatt
        ) {

            throw new Error(
                "El dispositivo no proporciona GATT."
            );
        }


        bluetoothServer =
            await bluetoothDevice.gatt.connect();


        if (
            !bluetoothServer
            ||
            !bluetoothServer.connected
        ) {

            throw new Error(
                "GATT no quedó conectado."
            );
        }


        log(
            "✅ CONEXIÓN GATT ESTABLECIDA."
        );


        deviceGATT.textContent =
            "GATT: 🟢 Conectado";


        setStatus(
            "🟢 Smart Band conectada",
            "success"
        );


        connectBtn.textContent =
            "🟢 Smart Band conectada";


        disconnectBtn.style.display =
            "block";


        /*
         * Buscar servicios.
         */

        await discoverServices();


    } catch (error) {

        console.error(
            "Bluetooth error:",
            error
        );


        log(
            "❌ ERROR DE BLUETOOTH"
        );


        log(
            "Nombre del error: " +
            (
                error.name
                || "desconocido"
            )
        );


        log(
            "Mensaje: " +
            (
                error.message
                || error
            )
        );


        if (
            error.name ===
            "NotFoundError"
        ) {

            setStatus(
                "⚪ Selección cancelada",
                "warning"
            );


            log(
                "El selector Bluetooth fue cancelado."
            );

        } else {

            setStatus(
                "❌ No se pudo conectar",
                "error"
            );
        }


        connectBtn.disabled =
            false;

        connectBtn.textContent =
            "🔗 Conectar Smart Band";
    }
}


/* =========================================================
   DESCUBRIR SERVICIOS
   ========================================================= */

async function discoverServices() {

    if (
        !bluetoothServer
        ||
        !bluetoothServer.connected
    ) {

        log(
            "❌ No existe una conexión GATT activa."
        );

        return;
    }


    log(
        "================================"
    );

    log(
        "BUSCANDO SERVICIOS GATT..."
    );


    servicesContainer.innerHTML =
        "";


    servicesBox.style.display =
        "block";


    let services;


    try {

        services =
            await bluetoothServer
                .getPrimaryServices();

    } catch (error) {

        log(
            "❌ Error obteniendo servicios: " +
            error.message
        );

        servicesContainer.textContent =
            "No se pudieron obtener los servicios.";

        return;
    }


    log(
        "Número de servicios encontrados: " +
        services.length
    );


    if (
        services.length === 0
    ) {

        servicesContainer.textContent =
            "⚠️ No se encontraron servicios primarios.";

        log(
            "La pulsera no devolvió servicios primarios."
        );

        return;
    }


    /*
     * Recorrer servicios.
     */

    for (
        const service
        of services
    ) {

        log(
            "--------------------------------"
        );

        log(
            "SERVICIO: " +
            service.uuid
        );


        const serviceElement =
            document.createElement(
                "div"
            );


        serviceElement.className =
            "service";


        const serviceTitle =
            document.createElement(
                "div"
            );


        serviceTitle.className =
            "service-title";


        serviceTitle.textContent =
            "🔧 Servicio: " +
            service.uuid;


        serviceElement.appendChild(
            serviceTitle
        );


        let characteristics = [];


        try {

            characteristics =
                await service
                    .getCharacteristics();

        } catch (error) {

            log(
                "❌ Error obteniendo características: " +
                error.message
            );

            serviceElement.innerHTML +=
                "<div style='margin-top:10px;color:#ff8f8f'>" +
                "No se pudieron obtener las características." +
                "</div>";

            servicesContainer.appendChild(
                serviceElement
            );

            continue;
        }


        log(
            "Características encontradas: " +
            characteristics.length
        );


        for (
            const characteristic
            of characteristics
        ) {

            const characteristicElement =
                document.createElement(
                    "div"
                );


            characteristicElement.className =
                "characteristic";


            const title =
                document.createElement(
                    "div"
                );


            title.innerHTML =
                "<strong>Característica:</strong><br>" +
                characteristic.uuid;


            characteristicElement.appendChild(
                title
            );


            /*
             * Propiedades.
             */

            const properties =
                characteristic.properties;


            const propertyContainer =
                document.createElement(
                    "div"
                );


            propertyContainer.style.marginTop =
                "6px";


            Object.keys(properties)
                .filter(
                    key =>
                        properties[key] === true
                )
                .forEach(
                    property => {

                        const badge =
                            document.createElement(
                                "span"
                            );

                        badge.className =
                            "property";

                        badge.textContent =
                            property;

                        propertyContainer.appendChild(
                            badge
                        );
                    }
                );


            characteristicElement.appendChild(
                propertyContainer
            );


            log(
                "Característica: " +
                characteristic.uuid +
                " | Propiedades: " +
                Object.keys(properties)
                    .filter(
                        key =>
                            properties[key]
                    )
                    .join(", ")
            );


            /*
             * Intentar leer automáticamente.
             *
             * Solo READ.
             */

            if (
                properties.read
            ) {

                try {

                    log(
                        "Intentando lectura: " +
                        characteristic.uuid
                    );


                    const value =
                        await characteristic
                            .readValue();


                    const bytes = [];


                    for (
                        let i = 0;
                        i < value.byteLength;
                        i++
                    ) {

                        bytes.push(
                            value.getUint8(i)
                        );
                    }


                    const hexadecimal =
                        bytes
                            .map(
                                byte =>
                                    byte
                                        .toString(16)
                                        .padStart(
                                            2,
                                            "0"
                                        )
                                        .toUpperCase()
                            )
                            .join(" ");


                    log(
                        "DATOS: " +
                        bytes.join(" ") +
                        " | HEX: " +
                        hexadecimal
                    );


                    const dataElement =
                        document.createElement(
                            "div"
                        );


                    dataElement.className =
                        "read-data";


                    dataElement.innerHTML =
                        "<strong>Datos:</strong> " +
                        (
                            bytes.length
                                ? bytes.join(" ")
                                : "sin datos"
                        ) +
                        "<br>" +
                        "<strong>HEX:</strong> " +
                        (
                            hexadecimal
                                || "—"
                        );


                    characteristicElement.appendChild(
                        dataElement
                    );


                } catch (error) {

                    log(
                        "⚠️ No se pudo leer " +
                        characteristic.uuid +
                        ": " +
                        error.message
                    );


                    const errorElement =
                        document.createElement(
                            "div"
                        );


                    errorElement.style.color =
                        "#ff9999";

                    errorElement.style.marginTop =
                        "7px";


                    errorElement.textContent =
                        "Lectura no disponible: " +
                        error.message;


                    characteristicElement.appendChild(
                        errorElement
                    );
                }
            }


            serviceElement.appendChild(
                characteristicElement
            );
        }


        servicesContainer.appendChild(
            serviceElement
        );
    }


    log(
        "================================"
    );

    log(
        "FINALIZÓ EL ESCANEO GATT."
    );

    log(
        "La información mostrada permitirá identificar el protocolo de la F1 Plus."
    );
}


/* =========================================================
   DESCONEXIÓN
   ========================================================= */

function handleDisconnected() {

    log(
        "================================"
    );

    log(
        "🔴 SMART BAND DESCONECTADA."
    );


    setStatus(
        "🔴 Smart Band desconectada",
        "error"
    );


    deviceGATT.textContent =
        "GATT: 🔴 Desconectado";


    connectBtn.disabled =
        false;


    connectBtn.textContent =
        "🔗 Conectar Smart Band";


    disconnectBtn.style.display =
        "none";


    bluetoothServer =
        null;
}


/* =========================================================
   DESCONEXIÓN MANUAL
   ========================================================= */

function disconnectBand() {

    log(
        "Solicitando desconexión..."
    );


    try {

        if (
            bluetoothDevice
            &&
            bluetoothDevice.gatt
            &&
            bluetoothDevice.gatt.connected
        ) {

            bluetoothDevice.gatt.disconnect();

            log(
                "Desconexión GATT ejecutada."
            );
        }

    } catch (error) {

        log(
            "❌ Error desconectando: " +
            error.message
        );
    }


    bluetoothServer =
        null;


    setStatus(
        "⚪ Estado: Desconectada",
        "warning"
    );


    connectBtn.disabled =
        false;


    connectBtn.textContent =
        "🔗 Conectar Smart Band";


    disconnectBtn.style.display =
        "none";
}


/* =========================================================
   LIMPIAR DIAGNÓSTICO
   ========================================================= */

function clearLog() {

    logContainer.textContent =
        "Sistema preparado.\n";

    log(
        "Diagnóstico limpiado."
    );
}


/* =========================================================
   EVENTOS
   ========================================================= */

connectBtn.addEventListener(
    "click",
    function (event) {

        event.preventDefault();

        event.stopPropagation();

        connectBand();
    }
);


disconnectBtn.addEventListener(
    "click",
    function (event) {

        event.preventDefault();

        event.stopPropagation();

        disconnectBand();
    }
);


clearLogBtn.addEventListener(
    "click",
    function (event) {

        event.preventDefault();

        clearLog();
    }
);


/* =========================================================
   INICIALIZACIÓN
   ========================================================= */

log(
    "Inicializando módulo Smart Band F1 Plus..."
);

checkBluetooth();


})();

</script>

</body>
</html>
