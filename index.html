<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>Smart Band F1 Plus - RoXThal Art Design</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:#080808;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif
}

body{
    min-height:100vh
}

.container{
    width:100%;
    max-width:760px;
    margin:auto;
    padding:20px 15px 40px
}

.header{
    text-align:center;
    padding:20px 10px
}

.logo{
    font-size:52px;
    margin-bottom:8px
}

.title{
    margin:0;
    font-size:28px
}

.subtitle{
    margin-top:8px;
    color:#aaa
}

.card{
    background:#151515;
    border-radius:20px;
    padding:20px;
    margin-top:18px;
    box-shadow:0 8px 30px rgba(0,0,0,.35)
}

.compatibility{
    background:#222;
    border-radius:12px;
    padding:14px;
    text-align:center;
    margin-bottom:15px;
    color:#ffd54a;
    font-weight:bold
}

button{
    width:100%;
    border:0;
    border-radius:14px;
    padding:16px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px
}

#connectBtn{
    background:#e0b400;
    color:#111
}

#disconnectBtn{
    background:#333;
    color:#fff;
    display:none
}

#testBtn{
    background:#292929;
    color:#fff
}

button:disabled{
    opacity:.5;
    cursor:not-allowed
}

.status{
    margin-top:15px;
    padding:15px;
    border-radius:12px;
    background:#202020;
    text-align:center
}

.status.success{
    background:#123d20;
    color:#7cff9b
}

.status.error{
    background:#431515;
    color:#ff8f8f
}

.status.warning{
    background:#403715;
    color:#ffe477
}

.info{
    display:none
}

.section-title{
    color:#ffd54a;
    font-size:19px;
    margin-top:0
}

.info-row{
    padding:11px;
    margin-top:8px;
    background:#202020;
    border-radius:9px;
    word-break:break-word
}

.service{
    background:#202020;
    border-radius:14px;
    padding:14px;
    margin-top:12px;
    word-break:break-word
}

.service-title{
    color:#ffd54a;
    font-weight:bold
}

.characteristic{
    background:#101010;
    border-radius:10px;
    padding:11px;
    margin-top:10px;
    word-break:break-word;
    font-size:13px
}

.property{
    display:inline-block;
    padding:4px 7px;
    margin:4px 3px 0 0;
    border-radius:6px;
    background:#333;
    color:#ddd
}

.data{
    margin-top:8px;
    color:#8fe3ff;
    word-break:break-word
}

.log{
    background:#050505;
    border-radius:12px;
    padding:14px;
    min-height:190px;
    max-height:380px;
    overflow-y:auto;
    white-space:pre-wrap;
    word-break:break-word;
    font-family:monospace;
    font-size:12px;
    line-height:1.55;
    color:#ccc
}

.clear{
    background:#292929;
    color:#fff;
    font-size:14px
}

.footer{
    text-align:center;
    color:#666;
    font-size:12px;
    margin-top:25px
}

.ok{
    color:#7cff9b
}

.warn{
    color:#ffe477
}

.err{
    color:#ff8f8f
}
</style>
</head>

<body>

<div class="container">

<header class="header">
    <div class="logo">⌚</div>

    <h1 class="title">
        Smart Band F1 Plus
    </h1>

    <div class="subtitle">
        RoXThal Art Design
    </div>
</header>


<!-- CONEXIÓN -->

<section class="card">

    <div id="compatibility" class="compatibility">
        🔵 Comprobando Bluetooth...
    </div>

    <button id="connectBtn" type="button">
        🔗 Conectar Smart Band
    </button>

    <button id="disconnectBtn" type="button">
        ❌ Desconectar Smart Band
    </button>

    <button id="testBtn" type="button">
        🧪 Comprobar Bluetooth
    </button>

    <div id="status" class="status">
        ⚪ Smart Band desconectada
    </div>

</section>


<!-- DISPOSITIVO -->

<section id="deviceInfo" class="card info">

    <h2 class="section-title">
        📱 Dispositivo detectado
    </h2>

    <div id="deviceName" class="info-row">
        Nombre: —
    </div>

    <div id="deviceId" class="info-row">
        ID: —
    </div>

    <div id="deviceGatt" class="info-row">
        GATT: —
    </div>

</section>


<!-- SERVICIOS -->

<section id="servicesBox" class="card info">

    <h2 class="section-title">
        🔧 Servicios Bluetooth
    </h2>

    <div id="services">
        Esperando conexión...
    </div>

</section>


<!-- DIAGNÓSTICO -->

<section class="card">

    <h2 class="section-title">
        🛠️ Diagnóstico F1 Plus
    </h2>

    <div id="log" class="log">Sistema preparado.</div>

    <button id="clearBtn" class="clear" type="button">
        🧹 Limpiar diagnóstico
    </button>

</section>


<div class="footer">
    RoXThal Art Design · Smart Band F1 Plus
</div>

</div>


<script>

"use strict";


/* =========================================================
   VARIABLES
========================================================= */

let bluetoothDevice = null;
let bluetoothServer = null;


/* =========================================================
   ELEMENTOS
========================================================= */

const connectBtn =
    document.getElementById("connectBtn");

const disconnectBtn =
    document.getElementById("disconnectBtn");

const testBtn =
    document.getElementById("testBtn");

const clearBtn =
    document.getElementById("clearBtn");

const compatibility =
    document.getElementById("compatibility");

const status =
    document.getElementById("status");

const deviceInfo =
    document.getElementById("deviceInfo");

const deviceName =
    document.getElementById("deviceName");

const deviceId =
    document.getElementById("deviceId");

const deviceGatt =
    document.getElementById("deviceGatt");

const servicesBox =
    document.getElementById("servicesBox");

const services =
    document.getElementById("services");

const logBox =
    document.getElementById("log");


/* =========================================================
   LOG
========================================================= */

function log(message){

    const time =
        new Date().toLocaleTimeString();

    const line =
        "[" + time + "] " + message;

    console.log(line);

    if(
        logBox.textContent.trim()
        === "Sistema preparado."
    ){
        logBox.textContent = "";
    }

    logBox.textContent +=
        line + "\n";

    logBox.scrollTop =
        logBox.scrollHeight;
}


/* =========================================================
   ESTADO
========================================================= */

function setStatus(message,type){

    status.textContent =
        message;

    status.className =
        "status";

    if(type){
        status.classList.add(type);
    }
}


/* =========================================================
   BLUETOOTH
========================================================= */

async function checkBluetooth(){

    log(
        "Comprobando Web Bluetooth..."
    );

    if(
        !navigator.bluetooth
    ){

        compatibility.textContent =
            "❌ Web Bluetooth no disponible";

        compatibility.className =
            "compatibility";

        compatibility.classList.add(
            "error"
        );

        connectBtn.disabled =
            true;

        log(
            "ERROR: navigator.bluetooth no existe."
        );

        return false;
    }


    let available = true;


    if(
        typeof navigator.bluetooth.getAvailability
        === "function"
    ){

        try{

            available =
                await navigator.bluetooth
                    .getAvailability();

        }catch(error){

            log(
                "No se pudo consultar disponibilidad: "
                + error.message
            );
        }
    }


    if(!available){

        compatibility.textContent =
            "⚠️ Bluetooth no está disponible";

        compatibility.className =
            "compatibility warning";

        connectBtn.disabled =
            true;

        log(
            "El navegador informa que Bluetooth no está disponible."
        );

        return false;
    }


    compatibility.textContent =
        "✅ Web Bluetooth disponible";

    compatibility.className =
        "compatibility";

    connectBtn.disabled =
        false;

    log(
        "Web Bluetooth detectado correctamente."
    );

    return true;
}


/* =========================================================
   SERVICIOS QUE AUTORIZAMOS
========================================================= */

/*
   Con acceptAllDevices=true, Web Bluetooth necesita que
   los servicios consultables estén declarados en
   optionalServices.

   Incluimos servicios estándar habituales en pulseras
   inteligentes.

   También incluimos UUIDs genéricos de 128 bits que
   posteriormente podemos ampliar si el diagnóstico
   encuentra información adicional.
*/

const OPTIONAL_SERVICES = [

    /* Battery */
    "battery_service",

    /* Device Information */
    "device_information",

    /* Heart Rate */
    "heart_rate",

    /* Health Thermometer */
    "health_thermometer",

    /* Blood Pressure */
    "blood_pressure",

    /* Pulse Oximeter */
    "pulse_oximeter",

    /* Human Interface Device */
    "human_interface_device",

    /* Current Time */
    "current_time",

    /* Immediate Alert */
    "immediate_alert",

    /* Link Loss */
    "link_loss",

    /* Tx Power */
    "tx_power",

    /* Generic Access */
    "generic_access",

    /* Generic Attribute */
    "generic_attribute",

    /*
     * UUIDs propietarios frecuentes en dispositivos
     * BLE. Se pueden ampliar posteriormente cuando
     * tengamos información de la F1 Plus.
     */

    "6e400001-b5a3-f393-e0a9-e50e24dcca9e",
    "0000fee0-0000-1000-8000-00805f9b34fb",
    "0000fee1-0000-1000-8000-00805f9b34fb"

];


/* =========================================================
   CONECTAR
========================================================= */

async function connectBand(){

    log(
        "================================"
    );

    log(
        "Inicio del proceso de conexión."
    );


    const bluetoothOK =
        await checkBluetooth();


    if(!bluetoothOK){

        setStatus(
            "❌ Bluetooth Web no disponible",
            "error"
        );

        return;
    }


    connectBtn.disabled =
        true;

    connectBtn.textContent =
        "🔍 Buscando Smart Band...";


    setStatus(
        "🔵 Abriendo selector Bluetooth...",
        "warning"
    );


    try{

        log(
            "Solicitando dispositivo Bluetooth."
        );


        log(
            "Preparando permisos de servicios..."
        );


        /*
         * IMPORTANTE:
         *
         * No usamos filtros por nombre.
         *
         * Así mantenemos la capacidad de encontrar
         * la misma F1 Plus que ya detectamos.
         */

        bluetoothDevice =
            await navigator.bluetooth.requestDevice({

                acceptAllDevices: true,

                optionalServices:
                    OPTIONAL_SERVICES

            });


        if(!bluetoothDevice){

            throw new Error(
                "No se recibió ningún dispositivo."
            );
        }


        log(
            "================================"
        );

        log(
            "DISPOSITIVO ENCONTRADO"
        );


        log(
            "Nombre: "
            +
            (
                bluetoothDevice.name
                ||
                "Sin nombre"
            )
        );


        log(
            "ID: "
            +
            (
                bluetoothDevice.id
                ||
                "No disponible"
            )
        );


        deviceName.textContent =
            "Nombre: "
            +
            (
                bluetoothDevice.name
                ||
                "Sin nombre"
            );


        deviceId.textContent =
            "ID: "
            +
            (
                bluetoothDevice.id
                ||
                "No disponible"
            );


        deviceGatt.textContent =
            "GATT: conectando...";


        deviceInfo.style.display =
            "block";


        bluetoothDevice.addEventListener(
            "gattserverdisconnected",
            handleDisconnected
        );


        connectBtn.textContent =
            "🔄 Conectando...";


        setStatus(
            "🔄 Conectando con "
            +
            (
                bluetoothDevice.name
                ||
                "F1 Plus"
            )
            +
            "...",
            "warning"
        );


        if(
            !bluetoothDevice.gatt
        ){

            throw new Error(
                "El dispositivo no dispone de GATT."
            );
        }


        log(
            "Intentando conexión GATT..."
        );


        bluetoothServer =
            await bluetoothDevice.gatt.connect();


        if(
            !bluetoothServer
            ||
            !bluetoothServer.connected
        ){

            throw new Error(
                "GATT no quedó conectado."
            );
        }


        log(
            "✅ CONEXIÓN GATT ESTABLECIDA."
        );


        deviceGatt.textContent =
            "GATT: 🟢 Conectado";


        setStatus(
            "🟢 Smart Band conectada",
            "success"
        );


        connectBtn.textContent =
            "🟢 Smart Band conectada";


        disconnectBtn.style.display =
            "block";


        /*
         * Ahora buscamos servicios.
         */

        await discoverServices();


    }catch(error){

        console.error(
            "Bluetooth:",
            error
        );


        log(
            "❌ ERROR DE BLUETOOTH"
        );


        log(
            "Tipo: "
            +
            (
                error.name
                ||
                "desconocido"
            )
        );


        log(
            "Mensaje: "
            +
            (
                error.message
                ||
                String(error)
            )
        );


        if(
            error.name ===
            "NotFoundError"
        ){

            setStatus(
                "⚪ Selección cancelada",
                "warning"
            );

            log(
                "El selector Bluetooth fue cancelado."
            );

        }else{

            setStatus(
                "❌ No se pudo conectar",
                "error"
            );
        }


        connectBtn.disabled =
            false;

        connectBtn.textContent =
            "🔗 Conectar Smart Band";
    }
}


/* =========================================================
   DESCUBRIR SERVICIOS
========================================================= */

async function discoverServices(){

    if(
        !bluetoothServer
        ||
        !bluetoothServer.connected
    ){

        log(
            "❌ No hay conexión GATT activa."
        );

        return;
    }


    log(
        "================================"
    );

    log(
        "BUSCANDO SERVICIOS GATT..."
    );


    servicesBox.style.display =
        "block";


    services.innerHTML =
        "";


    let primaryServices = [];


    try{

        primaryServices =
            await bluetoothServer
                .getPrimaryServices();

    }catch(error){

        log(
            "❌ Error obteniendo servicios: "
            +
            error.message
        );


        services.innerHTML =
            "<div class='service'>" +
            "<span class='err'>" +
            "❌ No se pudieron consultar los servicios." +
            "</span><br><br>" +
            "La conexión GATT existe, pero el navegador " +
            "no ha autorizado ningún servicio accesible " +
            "de la pulsera." +
            "</div>";


        return;
    }


    log(
        "Servicios encontrados: "
        +
        primaryServices.length
    );


    if(
        primaryServices.length === 0
    ){

        services.innerHTML =
            "<div class='service'>" +
            "⚠️ La F1 Plus no devolvió servicios primarios." +
            "</div>";

        return;
    }


    for(
        const service
        of primaryServices
    ){

        await inspectService(
            service
        );
    }


    log(
        "================================"
    );

    log(
        "FINALIZÓ EL DESCUBRIMIENTO GATT."
    );
}


/* =========================================================
   INSPECCIONAR SERVICIO
========================================================= */

async function inspectService(service){

    log(
        "--------------------------------"
    );

    log(
        "SERVICIO: "
        +
        service.uuid
    );


    const serviceElement =
        document.createElement("div");

    serviceElement.className =
        "service";


    const title =
        document.createElement("div");

    title.className =
        "service-title";

    title.textContent =
        "🔧 Servicio: "
        +
        service.uuid;

    serviceElement.appendChild(
        title
    );


    let characteristics = [];


    try{

        characteristics =
            await service
                .getCharacteristics();

    }catch(error){

        log(
            "⚠️ No se pudieron obtener características: "
            +
            error.message
        );


        const errorElement =
            document.createElement("div");

        errorElement.className =
            "err";

        errorElement.style.marginTop =
            "8px";

        errorElement.textContent =
            "No se pudieron consultar las características.";

        serviceElement.appendChild(
            errorElement
        );

        services.appendChild(
            serviceElement
        );

        return;
    }


    log(
        "Características encontradas: "
        +
        characteristics.length
    );


    for(
        const characteristic
        of characteristics
    ){

        await inspectCharacteristic(
            characteristic,
            serviceElement
        );
    }


    services.appendChild(
        serviceElement
    );
}


/* =========================================================
   INSPECCIONAR CARACTERÍSTICA
========================================================= */

async function inspectCharacteristic(
    characteristic,
    parent
){

    const properties =
        characteristic.properties || {};


    const propertyNames =
        Object.keys(properties)
            .filter(
                key =>
                    properties[key] === true
            );


    log(
        "Característica: "
        +
        characteristic.uuid
        +
        " | "
        +
        propertyNames.join(", ")
    );


    const element =
        document.createElement("div");

    element.className =
        "characteristic";


    const title =
        document.createElement("div");

    title.innerHTML =
        "<strong>Característica:</strong><br>"
        +
        characteristic.uuid;

    element.appendChild(
        title
    );


    const propertyContainer =
        document.createElement("div");

    propertyNames.forEach(
        property => {

            const badge =
                document.createElement("span");

            badge.className =
                "property";

            badge.textContent =
                property;

            propertyContainer.appendChild(
                badge
            );
        }
    );


    element.appendChild(
        propertyContainer
    );


    /*
     * READ
     */

    if(
        properties.read
    ){

        try{

            log(
                "Intentando lectura: "
                +
                characteristic.uuid
            );


            const value =
                await characteristic
                    .readValue();


            const bytes = [];

            for(
                let i = 0;
                i < value.byteLength;
                i++
            ){

                bytes.push(
                    value.getUint8(i)
                );
            }


            const hex =
                bytes
                    .map(
                        byte =>
                            byte
                                .toString(16)
                                .padStart(
                                    2,
                                    "0"
                                )
                                .toUpperCase()
                    )
                    .join(" ");


            log(
                "DATOS: "
                +
                (
                    bytes.length
                        ? bytes.join(" ")
                        : "sin datos"
                )
            );


            log(
                "HEX: "
                +
                (
                    hex || "—"
                )
            );


            const data =
                document.createElement("div");

            data.className =
                "data";

            data.innerHTML =
                "<strong>READ:</strong> "
                +
                (
                    bytes.length
                        ? bytes.join(" ")
                        : "sin datos"
                )
                +
                "<br>" +
                "<strong>HEX:</strong> "
                +
                (
                    hex || "—"
                );


            element.appendChild(
                data
            );


        }catch(error){

            log(
                "⚠️ Lectura no disponible: "
                +
                error.message
            );


            const errorElement =
                document.createElement("div");

            errorElement.className =
                "warn";

            errorElement.style.marginTop =
                "8px";

            errorElement.textContent =
                "READ no disponible: "
                +
                error.message;

            element.appendChild(
                errorElement
            );
        }
    }


    /*
     * NOTIFY / INDICATE
     *
     * NO activamos notificaciones todavía.
     *
     * Solo informamos que existen.
     */

    if(
        properties.notify ||
        properties.indicate
    ){

        const notifyInfo =
            document.createElement("div");

        notifyInfo.className =
            "data";

        notifyInfo.textContent =
            "📡 Esta característica permite notificaciones. " +
            "No se activa todavía para evitar enviar cambios " +
            "a la pulsera sin conocer su protocolo.";

        element.appendChild(
            notifyInfo
        );
    }


    /*
     * WRITE
     *
     * NO escribimos nada todavía.
     */

    if(
        properties.write ||
        properties.writeWithoutResponse
    ){

        const writeInfo =
            document.createElement("div");

        writeInfo.className =
            "data";

        writeInfo.textContent =
            "✍️ Esta característica permite escritura. " +
            "No se enviarán comandos hasta identificar " +
            "el protocolo de la F1 Plus.";

        element.appendChild(
            writeInfo
        );
    }


    parent.appendChild(
        element
    );
}


/* =========================================================
   DESCONEXIÓN
========================================================= */

function handleDisconnected(){

    log(
        "================================"
    );

    log(
        "🔴 SMART BAND DESCONECTADA."
    );


    setStatus(
        "🔴 Smart Band desconectada",
        "error"
    );


    deviceGatt.textContent =
        "GATT: 🔴 Desconectado";


    connectBtn.disabled =
        false;

    connectBtn.textContent =
        "🔗 Conectar Smart Band";


    disconnectBtn.style.display =
        "none";


    bluetoothServer =
        null;
}


/* =========================================================
   DESCONEXIÓN MANUAL
========================================================= */

function disconnectBand(){

    log(
        "Solicitando desconexión..."
    );


    try{

        if(
            bluetoothDevice
            &&
            bluetoothDevice.gatt
            &&
            bluetoothDevice.gatt.connected
        ){

            bluetoothDevice.gatt.disconnect();

            log(
                "Desconexión GATT ejecutada."
            );
        }

    }catch(error){

        log(
            "Error desconectando: "
            +
            error.message
        );
    }


    bluetoothServer =
        null;


    handleDisconnected();
}


/* =========================================================
   LIMPIAR DIAGNÓSTICO
========================================================= */

function clearLog(){

    logBox.textContent =
        "Sistema preparado.";

    log(
        "Diagnóstico limpiado."
    );
}


/* =========================================================
   EVENTOS
========================================================= */

connectBtn.addEventListener(
    "click",
    function(event){

        event.preventDefault();

        connectBand();
    }
);


disconnectBtn.addEventListener(
    "click",
    function(event){

        event.preventDefault();

        disconnectBand();
    }
);


testBtn.addEventListener(
    "click",
    function(event){

        event.preventDefault();

        checkBluetooth();
    }
);


clearBtn.addEventListener(
    "click",
    function(event){

        event.preventDefault();

        clearLog();
    }
);


/* =========================================================
   INICIO
========================================================= */

window.addEventListener(
    "load",
    function(){

        log(
            "Inicializando módulo Smart Band F1 Plus..."
        );

        checkBluetooth();

    }
);

</script>

</body>
</html>
